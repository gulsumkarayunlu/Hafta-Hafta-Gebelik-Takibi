<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hafta Hafta Gebelik Takibi</title>
<style>
  :root{
    --butter: #F6E7A8;
    --butter-soft: #FBF3D3;
    --sage: #9CB38A;
    --sage-deep: #7C9A6B;
    --sage-pale: #E3ECDA;
    --text-bold: #6E7F5C;
    --text-bold-2: #B98A4A;
    --card-bg: #FDF8E8;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    font-family:'Quicksand','Segoe UI',sans-serif;
    background:linear-gradient(160deg, var(--butter) 0%, var(--butter-soft) 28%, var(--sage-pale) 60%, var(--sage) 100%);
    background-attachment:fixed;
    color:var(--text-bold);
    padding:0 0 4rem 0;
  }

  header{
    text-align:center;
    padding:3rem 1.5rem 2rem;
  }

  header h1{
    font-size:2.2rem;
    font-weight:800;
    color:var(--text-bold);
    margin:0 0 .4rem;
    letter-spacing:.5px;
  }

  header p{
    font-weight:700;
    color:var(--text-bold-2);
    font-size:1.05rem;
    margin:0;
  }

  .selector-wrap{
    max-width:520px;
    margin:0 auto 2.5rem;
    padding:0 1.5rem;
    text-align:center;
  }

  .selector-wrap label{
    display:block;
    font-weight:800;
    margin-bottom:.6rem;
    font-size:1.1rem;
    color:var(--text-bold);
  }

  select{
    width:100%;
    padding:.9rem 1.1rem;
    border-radius:16px;
    border:3px solid var(--sage-deep);
    background:var(--card-bg);
    font-size:1.1rem;
    font-weight:800;
    color:var(--text-bold);
    appearance:none;
    cursor:pointer;
    text-align:center;
  }

  .week-slider{
    display:flex;
    align-items:center;
    gap:.8rem;
    max-width:520px;
    margin:1rem auto 0;
    padding:0 1.5rem;
  }

  input[type="range"]{
    flex:1;
    accent-color: var(--sage-deep);
  }

  .week-badge{
    min-width:54px;
    text-align:center;
    background:var(--sage-deep);
    color:var(--butter-soft);
    font-weight:800;
    border-radius:12px;
    padding:.4rem .3rem;
  }

  main{
    max-width:680px;
    margin:0 auto;
    padding:0 1.5rem;
  }

  .info-card{
    background:var(--card-bg);
    border:3px solid var(--sage-deep);
    border-radius:28px;
    padding:2rem 1.8rem;
    box-shadow:0 10px 0 var(--sage-deep), 0 14px 24px rgba(124,154,107,.25);
  }

  .info-card .top-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:1rem;
    margin-bottom:1.2rem;
  }

  .week-title{
    font-size:1.6rem;
    font-weight:800;
    color:var(--text-bold);
  }

  .fruit-row{
    display:flex;
    align-items:center;
    gap:.6rem;
  }

  .fruit-icon{
    width:44px;
    height:44px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--sage-pale);
    border-radius:50%;
    flex-shrink:0;
  }

  .fruit-pill{
    background:var(--butter);
    color:var(--text-bold-2);
    font-weight:800;
    padding:.5rem 1rem;
    border-radius:999px;
    font-size:.95rem;
  }

  .stats-row{
    display:flex;
    gap:1rem;
    margin-bottom:1.4rem;
    flex-wrap:wrap;
  }

  .stat{
    flex:1;
    min-width:120px;
    background:var(--sage-pale);
    border-radius:18px;
    padding:.8rem 1rem;
    text-align:center;
  }

  .stat span{
    display:block;
  }

  .stat .stat-label{
    font-weight:800;
    font-size:.8rem;
    color:var(--text-bold-2);
    margin-bottom:.2rem;
  }

  .stat .stat-value{
    font-weight:800;
    font-size:1.2rem;
    color:var(--text-bold);
  }

  .week-desc{
    font-weight:700;
    line-height:1.7;
    font-size:1.02rem;
    color:var(--text-bold);
  }

  .trimester-tag{
    display:inline-block;
    margin-top:1.4rem;
    background:var(--sage-deep);
    color:var(--butter-soft);
    font-weight:800;
    font-size:.85rem;
    padding:.4rem 1rem;
    border-radius:999px;
  }

  footer{
    margin-top:4rem;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:.6rem;
  }

  footer p{
    font-weight:800;
    color:var(--text-bold-2);
    font-size:.95rem;
  }

  .baby-wrap{
    position:relative;
    width:140px;
    height:140px;
    cursor:pointer;
  }

  .baby-svg{
    width:140px;
    height:140px;
    transform-origin:50% 90%;
  }

  .baby-arm{
    transform-origin:62px 70px;
    animation:wave 1.8s ease-in-out infinite;
  }

  @keyframes wave{
    0%,100%{ transform:rotate(0deg); }
    25%{ transform:rotate(-28deg); }
    50%{ transform:rotate(0deg); }
    75%{ transform:rotate(-18deg); }
  }

  .glitter{
    position:absolute;
    top:0; left:0;
    width:10px; height:10px;
    border-radius:50%;
    pointer-events:none;
    animation:pop .9s ease-out forwards;
  }

  @keyframes pop{
    0%{ opacity:1; transform:translate(0,0) scale(1); }
    100%{ opacity:0; transform:translate(var(--dx), var(--dy)) scale(.3); }
  }

  @media (max-width:480px){
    header h1{font-size:1.7rem;}
    .info-card{padding:1.5rem 1.1rem;}
    .stats-row{flex-direction:column;}
  }
</style>
</head>
<body>

<header>
  <h1>Hafta Hafta Gebelik Rehberi</h1>
  <p>Hangi haftadasınız? Aşağıdan seçin, bebeğinizin o haftaki gelişimini görün.</p>
</header>

<div class="selector-wrap">
  <label for="week-select">Gebelik haftanızı seçin</label>
  <select id="week-select"></select>
  <div class="week-slider">
    <span style="font-weight:800;">1</span>
    <input type="range" id="week-range" min="1" max="40" value="1" step="1">
    <span style="font-weight:800;">40</span>
    <div class="week-badge" id="range-badge">1</div>
  </div>
</div>

<main>
  <div class="info-card" id="info-card"></div>
</main>

<footer>
  <p>Bebeğiniz size el sallıyor</p>
  <div class="baby-wrap" id="baby-wrap">
    <svg class="baby-svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="60" cy="78" rx="34" ry="30" fill="#F6E7A8"/>
      <circle cx="60" cy="42" r="26" fill="#FCE9C9"/>
      <path d="M36 36 Q60 14 84 36 Q84 18 60 14 Q36 18 36 36 Z" fill="#9CB38A"/>
      <circle cx="50" cy="44" r="3.4" fill="#6E7F5C"/>
      <circle cx="70" cy="44" r="3.4" fill="#6E7F5C"/>
      <path d="M52 54 Q60 60 68 54" stroke="#B98A4A" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <circle cx="42" cy="50" r="4" fill="#F4B7A6" opacity="0.6"/>
      <circle cx="78" cy="50" r="4" fill="#F4B7A6" opacity="0.6"/>
      <g class="baby-arm">
        <ellipse cx="86" cy="72" rx="9" ry="16" fill="#FCE9C9"/>
      </g>
      <ellipse cx="40" cy="80" rx="9" ry="15" fill="#FCE9C9"/>
    </svg>
  </div>
</footer>

<script>
function fruitSVG(type, c, accent){
  accent = accent || '#7C9A6B';
  let body = '';
  if(type==='round'){
    body = `<circle cx="30" cy="34" r="18" fill="${c}"/><path d="M28 16 Q33 9 39 14" stroke="${accent}" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="38" cy="12" rx="5" ry="3.5" fill="${accent}"/>`;
  } else if(type==='long'){
    body = `<path d="M16 44 Q14 16 44 14 Q46 32 30 42 Q22 46 16 44 Z" fill="${c}"/>`;
  } else if(type==='oval'){
    body = `<ellipse cx="30" cy="30" rx="15" ry="21" fill="${c}"/><ellipse cx="30" cy="11" rx="5" ry="3.5" fill="${accent}"/>`;
  } else if(type==='cluster'){
    body = `<circle cx="20" cy="36" r="7" fill="${c}"/><circle cx="32" cy="36" r="7" fill="${c}"/><circle cx="26" cy="25" r="7" fill="${c}"/><path d="M26 15 Q30 9 36 13" stroke="${accent}" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  } else if(type==='tiny'){
    body = `<circle cx="30" cy="30" r="7" fill="${c}"/>`;
  } else if(type==='melon'){
    body = `<circle cx="30" cy="32" r="18" fill="${c}"/><path d="M14 32 Q30 25 46 32" stroke="${accent}" stroke-width="2" fill="none" opacity="0.55"/><path d="M16 25 Q30 19 44 25" stroke="${accent}" stroke-width="2" fill="none" opacity="0.45"/>`;
  } else if(type==='watermelon'){
    body = `<path d="M11 30 A19 19 0 0 1 49 30 Z" fill="${c}"/><path d="M11 30 A19 19 0 0 1 49 30 L45 30 A15 15 0 0 0 15 30 Z" fill="${accent}"/>`;
  } else if(type==='leaf'){
    body = `<path d="M30 12 C44 16 46 32 30 48 C14 32 16 16 30 12 Z" fill="${c}"/><path d="M30 14 L30 46" stroke="${accent}" stroke-width="1.6" opacity="0.5"/>`;
  } else if(type==='cob'){
    body = `<rect x="22" y="10" width="16" height="38" rx="8" fill="${c}"/><circle cx="27" cy="18" r="2" fill="${accent}"/><circle cx="33" cy="18" r="2" fill="${accent}"/><circle cx="27" cy="26" r="2" fill="${accent}"/><circle cx="33" cy="26" r="2" fill="${accent}"/><circle cx="27" cy="34" r="2" fill="${accent}"/><circle cx="33" cy="34" r="2" fill="${accent}"/><circle cx="27" cy="42" r="2" fill="${accent}"/><circle cx="33" cy="42" r="2" fill="${accent}"/>`;
  }
  return `<svg viewBox="0 0 60 60" width="44" height="44">${body}</svg>`;
}

const select = document.getElementById('week-select');
const range = document.getElementById('week-range');
const badge = document.getElementById('range-badge');
const card = document.getElementById('info-card');

weeksData.forEach(item => {
  const opt = document.createElement('option');
  opt.value = item.w;
  opt.textContent = item.w + '. hafta';
  select.appendChild(opt);
});

function triLabel(t){
  if(t===1) return '1. trimester';
  if(t===2) return '2. trimester';
  return '3. trimester';
}

function renderWeek(weekNum){
  const item = weeksData.find(w => w.w === Number(weekNum));
  if(!item) return;
  card.innerHTML = `
    <div class="top-row">
      <div class="week-title">${item.w}. hafta</div>
      <div class="fruit-row">
        <div class="fruit-icon">${fruitSVG(item.icon.type, item.icon.color, item.icon.accent)}</div>
        <div class="fruit-pill">${item.fruit}</div>
      </div>
    </div>
    <div class="stats-row">
      <div class="stat">
        <span class="stat-label">Boy</span>
        <span class="stat-value">${item.length}</span>
      </div>
      <div class="stat">
        <span class="stat-label">Kilo</span>
        <span class="stat-value">${item.weight}</span>
      </div>
    </div>
    <p class="week-desc">${item.desc}</p>
    <div class="trimester-tag">${triLabel(item.tri)}</div>
  `;
  select.value = item.w;
  range.value = item.w;
  badge.textContent = item.w;
}

select.addEventListener('change', () => renderWeek(select.value));
range.addEventListener('input', () => renderWeek(range.value));

renderWeek(1);

const babyWrap = document.getElementById('baby-wrap');
const glitterColors = ['#F6E7A8','#9CB38A','#FCE9C9','#7C9A6B','#B98A4A'];

function burstGlitter(){
  for(let i=0;i<14;i++){
    const dot = document.createElement('div');
    dot.className = 'glitter';
    const angle = Math.random()*Math.PI*2;
    const dist = 40 + Math.random()*50;
    dot.style.setProperty('--dx', Math.cos(angle)*dist + 'px');
    dot.style.setProperty('--dy', Math.sin(angle)*dist + 'px');
    dot.style.left = (60 + Math.random()*20 - 10) + 'px';
    dot.style.top = (50 + Math.random()*20 - 10) + 'px';
    dot.style.background = glitterColors[Math.floor(Math.random()*glitterColors.length)];
    babyWrap.appendChild(dot);
    setTimeout(()=> dot.remove(), 950);
  }
}

babyWrap.addEventListener('click', burstGlitter);
babyWrap.addEventListener('mouseenter', burstGlitter);
</script>
